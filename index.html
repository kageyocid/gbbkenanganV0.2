    <!-- Popup Info Foto -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modal-img" src="" alt="">
            <p id="modal-text"></p>
        </div>
    </div>

    <footer>
        © 2025 | Website kenangan dibuat oleh anak magang dari lamongan
    </footer>

    <script>
        function putarLagu() {
            const lagu = document.getElementById("lagu");
            lagu.play();  // lagu mulai
        }
        // Tombol untuk menampilkan galeri
        const lihatBtn = document.getElementById('lihatBtn');
        const gallery = document.getElementById('gallery');

        lihatBtn.addEventListener('click', () => {
            gallery.style.display = 'block';
            lihatBtn.style.display = 'none'; // sembunyikan tombol setelah diklik
        });

        // Popup modal
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalText = document.getElementById('modal-text');
        const closeBtn = document.querySelector('.close');
        const photos = document.querySelectorAll('.photos img');

        photos.forEach(photo => {
            photo.addEventListener('click', () => {
                modal.style.display = 'flex';
                modalImg.src = photo.src;
                modalText.textContent = photo.getAttribute('data-info');
            });
        });

        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    </script>
